<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop Quiz Party - Trivia CMS</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #161616;
    --border: #2a2a2a;
    --accent: #22c55e;
    --accent-dim: #16a34a;
    --text: #f0f0f0;
    --muted: #888;
    --danger: #ef4444;
    --warning: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Auth screen */
  #auth-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 24px;
  }
  #auth-screen h1 { font-size: 28px; font-weight: 800; }
  #auth-screen p { color: var(--muted); }
  .google-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 28px;
    background: white; color: #333;
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .google-btn:hover { transform: scale(1.03); }
  .google-btn svg { width: 20px; height: 20px; }

  /* Main app */
  #app { display: none; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 10;
  }
  header h1 { font-size: 20px; font-weight: 800; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .user-email { color: var(--muted); font-size: 13px; }
  .btn-logout {
    background: none; border: 1px solid var(--border);
    color: var(--muted); padding: 6px 14px;
    border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .btn-logout:hover { border-color: var(--muted); color: var(--text); }

  .container { max-width: 900px; margin: 0 auto; padding: 24px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
  .tab {
    padding: 10px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px; font-weight: 600;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* Calendar / date picker */
  .date-nav {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 20px;
  }
  .date-nav input[type="date"] {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
  }
  .date-nav input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
  .nav-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .date-status {
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 600;
  }
  .status-saved { background: var(--accent-dim); color: white; }
  .status-empty { background: #333; color: var(--muted); }
  .status-today { background: var(--warning); color: black; }

  /* Question cards */
  .questions-grid { display: flex; flex-direction: column; gap: 16px; }
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .question-card h3 {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 14px;
    font-weight: 700;
  }
  .field-group { margin-bottom: 14px; }
  .field-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field-group input,
  .field-group textarea,
  .field-group select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  .field-group input:focus,
  .field-group textarea:focus,
  .field-group select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field-group textarea { min-height: 70px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Buttons */
  .actions { display: flex; gap: 12px; margin-top: 24px; }
  .btn {
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
    font-family: inherit;
  }
  .btn:hover { transform: scale(1.02); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }

  /* Calendar view */
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 24px;
  }
  .cal-header {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
    padding: 8px 0;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.1s;
  }
  .cal-day:hover { border-color: var(--accent); }
  .cal-day.empty { cursor: default; }
  .cal-day.empty:hover { border-color: transparent; }
  .cal-day.has-data { background: var(--accent-dim); color: white; }
  .cal-day.today { border: 2px solid var(--warning); }
  .cal-day.selected { border: 2px solid var(--accent); background: rgba(34,197,94,0.15); }
  .cal-day.no-data { background: var(--card); color: var(--muted); }
  .cal-month-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-bottom: 16px;
  }
  .cal-month-nav span { font-size: 16px; font-weight: 700; min-width: 160px; text-align: center; }

  /* Bulk view */
  .bulk-list { display: flex; flex-direction: column; gap: 8px; }
  .bulk-row {
    display: grid;
    grid-template-columns: 100px 1fr 80px;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .bulk-row:hover { border-color: var(--accent); }
  .bulk-date { font-weight: 700; font-size: 14px; }
  .bulk-preview { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bulk-badge {
    font-size: 11px; font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    text-align: center;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: white;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    transition: transform 0.3s ease;
    z-index: 100;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  /* Stats */
  .stats-date-nav {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 20px;
  }
  .stats-date-nav input[type="date"] {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
  }
  .stats-date-nav input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
  .stats-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .stats-card h3 {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 700;
  }
  .stats-question-text {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .stats-bars { display: flex; flex-direction: column; gap: 8px; }
  .stats-row {
    display: flex; align-items: center; gap: 10px;
  }
  .stats-label {
    font-size: 12px; font-weight: 600;
    min-width: 60px;
    text-align: right;
  }
  .stats-bar-bg {
    flex: 1; height: 24px;
    background: #222;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .stats-bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.5s ease;
    display: flex; align-items: center;
    padding-left: 8px;
    font-size: 11px; font-weight: 700;
    color: white;
    min-width: fit-content;
  }
  .stats-bar-fill.correct { background: var(--accent); }
  .stats-bar-fill.wrong { background: var(--danger); }
  .stats-bar-fill.skipped { background: #666; }
  .stats-count {
    font-size: 12px; color: var(--muted);
    min-width: 30px;
  }
  .stats-summary {
    display: flex; gap: 24px; margin-bottom: 20px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .stats-summary-item {
    text-align: center; flex: 1;
  }
  .stats-summary-item .num {
    font-size: 28px; font-weight: 800;
  }
  .stats-summary-item .label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .stats-empty {
    text-align: center; color: var(--muted);
    padding: 60px 20px; font-size: 14px;
  }

  /* Import modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    max-width: 500px;
    width: 90%;
  }
  .modal h2 { margin-bottom: 16px; font-size: 18px; }
  .modal p { color: var(--muted); font-size: 14px; margin-bottom: 16px; line-height: 1.5; }
  .modal textarea {
    width: 100%;
    min-height: 120px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 10px;
    font-family: 'SF Mono', monospace;
    font-size: 12px;
    margin-bottom: 16px;
    resize: vertical;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <h1>Pop Quiz Party</h1>
  <p>Trivia CMS</p>
  <button class="google-btn" onclick="signIn()">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Sign in with Google
  </button>
</div>

<!-- Main App -->
<div id="app">
  <header>
    <h1>Pop Quiz Trivia CMS</h1>
    <div class="header-right">
      <span class="user-email" id="user-email"></span>
      <button class="btn-logout" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <div class="tab active" data-tab="editor" onclick="switchTab('editor')">Editor</div>
      <div class="tab" data-tab="calendar" onclick="switchTab('calendar')">Calendar</div>
      <div class="tab" data-tab="upcoming" onclick="switchTab('upcoming')">Upcoming</div>
      <div class="tab" data-tab="stats" onclick="switchTab('stats')">Stats</div>
    </div>

    <!-- EDITOR TAB -->
    <div id="tab-editor">
      <div class="date-nav">
        <button class="nav-btn" onclick="changeDate(-1)">&larr;</button>
        <input type="date" id="selected-date" onchange="loadDate(this.value)">
        <button class="nav-btn" onclick="changeDate(1)">&rarr;</button>
        <button class="nav-btn" onclick="goToday()" title="Today">*</button>
        <span class="date-status" id="date-status"></span>
      </div>

      <div class="questions-grid" id="questions-grid"></div>

      <div class="actions">
        <button class="btn btn-primary" onclick="saveQuestions()" id="btn-save">Save Questions</button>
        <button class="btn btn-danger" onclick="deleteDay()" id="btn-delete">Delete Day</button>
        <button class="btn btn-secondary" onclick="showImportModal()">Import from App</button>
      </div>
    </div>

    <!-- CALENDAR TAB -->
    <div id="tab-calendar" class="hidden">
      <div class="cal-month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">&larr;</button>
        <span id="cal-month-label"></span>
        <button class="nav-btn" onclick="changeMonth(1)">&rarr;</button>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
      <p style="color: var(--muted); font-size: 13px; text-align: center;">
        <span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--accent-dim);vertical-align:middle;margin-right:4px;"></span> Has questions
        <span style="margin: 0 8px;">|</span>
        <span style="display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--warning);vertical-align:middle;margin-right:4px;"></span> Today
      </p>
    </div>

    <!-- UPCOMING TAB -->
    <div id="tab-upcoming" class="hidden">
      <h2 style="margin-bottom: 16px; font-size: 18px;">Next 14 Days</h2>
      <div class="bulk-list" id="upcoming-list"></div>
    </div>

    <!-- STATS TAB -->
    <div id="tab-stats" class="hidden">
      <div class="stats-date-nav">
        <button class="nav-btn" onclick="changeStatsDate(-1)">&larr;</button>
        <input type="date" id="stats-date" onchange="loadStats(this.value)">
        <button class="nav-btn" onclick="changeStatsDate(1)">&rarr;</button>
        <button class="nav-btn" onclick="goStatsToday()" title="Today">*</button>
      </div>
      <div id="stats-content"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Import Modal -->
<div class="modal-overlay hidden" id="import-modal" onclick="if(event.target===this)closeImportModal()">
  <div class="modal">
    <h2>Import from App Data</h2>
    <p>Paste your existing TriviaQuestion Swift array entries. The CMS will parse date, questionType, artist, question, answer, and funFact fields.</p>
    <textarea id="import-text" placeholder='TriviaQuestion(date: "Apr 26", questionType: "On This Day", artist: "Duane Eddy", question: "...", answer: "...", funFact: "...")'></textarea>
    <div style="display:flex;gap:12px;">
      <button class="btn btn-primary" onclick="doImport()">Import</button>
      <button class="btn btn-secondary" onclick="closeImportModal()">Cancel</button>
      <button class="btn btn-secondary" onclick="importAllFromApp()">Import All App Data</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-im3CGPMw8OR39BCuYFjYfhAD4LpZRUo",
  authDomain: "pop-quiz-daily-trivia.firebaseapp.com",
  projectId: "pop-quiz-daily-trivia",
  storageBucket: "pop-quiz-daily-trivia.firebasestorage.app",
  messagingSenderId: "253695290153",
  appId: "1:253695290153:web:91d588a32cab10ee0de538"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// Expose to global
window._db = db;
window._auth = auth;
window._provider = provider;
window._doc = doc;
window._getDoc = getDoc;
window._setDoc = setDoc;
window._deleteDoc = deleteDoc;
window._collection = collection;
window._getDocs = getDocs;
window._query = query;
window._signInWithPopup = signInWithPopup;
window._fbSignOut = fbSignOut;

// Cache of which dates have data (for calendar)
window._dateCache = new Set();

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-email').textContent = user.email;
    goToday();
    loadDateCache();
  } else {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});
</script>

<script>
// --- Auth ---
function signIn() {
  _signInWithPopup(_auth, _provider).catch(e => toast('Auth failed: ' + e.message, true));
}
function signOut() {
  _fbSignOut(_auth);
}

// --- Date management ---
let currentDate = new Date();
let calMonth = new Date();

function formatDateKey(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function formatDisplay(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function formatAppDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function goToday() {
  currentDate = new Date();
  document.getElementById('selected-date').value = formatDateKey(currentDate);
  loadDate(formatDateKey(currentDate));
}

function changeDate(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  document.getElementById('selected-date').value = formatDateKey(currentDate);
  loadDate(formatDateKey(currentDate));
}

// --- Load date cache for calendar ---
async function loadDateCache() {
  try {
    const snap = await _getDocs(_collection(_db, 'dailyTrivia'));
    window._dateCache = new Set();
    snap.forEach(doc => window._dateCache.add(doc.id));
  } catch(e) {
    console.error('Cache load failed:', e);
  }
}

// --- Load questions for a date ---
async function loadDate(dateStr) {
  currentDate = new Date(dateStr + 'T12:00:00');
  const grid = document.getElementById('questions-grid');
  const status = document.getElementById('date-status');

  try {
    const docRef = _doc(_db, 'dailyTrivia', dateStr);
    const snap = await _getDoc(docRef);

    if (snap.exists()) {
      const data = snap.data();
      renderQuestions(data.questions || []);
      const isToday = dateStr === formatDateKey(new Date());
      status.textContent = isToday ? 'Live Today' : 'Saved';
      status.className = 'date-status ' + (isToday ? 'status-today' : 'status-saved');
    } else {
      renderQuestions([emptyQuestion(), emptyQuestion(), emptyQuestion()]);
      status.textContent = 'No questions';
      status.className = 'date-status status-empty';
    }
  } catch(e) {
    toast('Load failed: ' + e.message, true);
  }
}

function emptyQuestion() {
  return { questionType: 'On This Day', artist: '', question: '', answer: '', funFact: '' };
}

function renderQuestions(questions) {
  // Ensure we always have 3
  while (questions.length < 3) questions.push(emptyQuestion());
  const grid = document.getElementById('questions-grid');
  grid.innerHTML = questions.map((q, i) => `
    <div class="question-card">
      <h3>Question ${i + 1}</h3>
      <div class="field-row">
        <div class="field-group">
          <label>Question Type</label>
          <select id="q${i}-type">
            <option value="On This Day" ${q.questionType === 'On This Day' ? 'selected' : ''}>On This Day</option>
            <option value="General Knowledge" ${q.questionType === 'General Knowledge' ? 'selected' : ''}>General Knowledge</option>
            <option value="Name the Artist" ${q.questionType === 'Name the Artist' ? 'selected' : ''}>Name the Artist</option>
            <option value="Name the Song" ${q.questionType === 'Name the Song' ? 'selected' : ''}>Name the Song</option>
            <option value="Finish the Lyric" ${q.questionType === 'Finish the Lyric' ? 'selected' : ''}>Finish the Lyric</option>
          </select>
        </div>
        <div class="field-group">
          <label>Artist (for Apple Music lookup)</label>
          <input type="text" id="q${i}-artist" value="${escHTML(q.artist)}" placeholder="e.g. Taylor Swift or N/A">
        </div>
      </div>
      <div class="field-group">
        <label>Question</label>
        <textarea id="q${i}-question" placeholder="Write the trivia question...">${escHTML(q.question)}</textarea>
      </div>
      <div class="field-group">
        <label>Answer</label>
        <input type="text" id="q${i}-answer" value="${escHTML(q.answer)}" placeholder="The correct answer">
      </div>
      <div class="field-group">
        <label>Fun Fact</label>
        <textarea id="q${i}-funFact" placeholder="Shown on the answer card...">${escHTML(q.funFact)}</textarea>
      </div>
    </div>
  `).join('');
}

function escHTML(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function gatherQuestions() {
  const questions = [];
  for (let i = 0; i < 3; i++) {
    questions.push({
      questionType: document.getElementById(`q${i}-type`).value,
      artist: document.getElementById(`q${i}-artist`).value.trim(),
      question: document.getElementById(`q${i}-question`).value.trim(),
      answer: document.getElementById(`q${i}-answer`).value.trim(),
      funFact: document.getElementById(`q${i}-funFact`).value.trim(),
    });
  }
  return questions;
}

// --- Save ---
async function saveQuestions() {
  const dateStr = formatDateKey(currentDate);
  const questions = gatherQuestions();

  // Validate
  const incomplete = questions.some(q => !q.question || !q.answer);
  if (incomplete) {
    toast('Each question needs at least a question and answer.', true);
    return;
  }

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    // Store the app-style date key too for easy reference
    const appDate = formatAppDate(currentDate);
    await _setDoc(_doc(_db, 'dailyTrivia', dateStr), {
      date: appDate,
      dateKey: dateStr,
      questions: questions,
      updatedAt: new Date().toISOString()
    });
    window._dateCache.add(dateStr);
    toast('Saved ' + dateStr);
    const status = document.getElementById('date-status');
    const isToday = dateStr === formatDateKey(new Date());
    status.textContent = isToday ? 'Live Today' : 'Saved';
    status.className = 'date-status ' + (isToday ? 'status-today' : 'status-saved');
  } catch(e) {
    toast('Save failed: ' + e.message, true);
  }

  btn.disabled = false;
  btn.textContent = 'Save Questions';
}

// --- Delete ---
async function deleteDay() {
  const dateStr = formatDateKey(currentDate);
  if (!confirm(`Delete all questions for ${dateStr}?`)) return;

  try {
    await _deleteDoc(_doc(_db, 'dailyTrivia', dateStr));
    window._dateCache.delete(dateStr);
    loadDate(dateStr);
    toast('Deleted ' + dateStr);
  } catch(e) {
    toast('Delete failed: ' + e.message, true);
  }
}

// --- Toast ---
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { el.className = 'toast'; }, 2500);
}

// --- Tabs ---
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('tab-editor').classList.toggle('hidden', tab !== 'editor');
  document.getElementById('tab-calendar').classList.toggle('hidden', tab !== 'calendar');
  document.getElementById('tab-upcoming').classList.toggle('hidden', tab !== 'upcoming');
  document.getElementById('tab-stats').classList.toggle('hidden', tab !== 'stats');

  if (tab === 'calendar') renderCalendar();
  if (tab === 'upcoming') renderUpcoming();
  if (tab === 'stats') { goStatsToday(); }
}

// --- Calendar ---
function changeMonth(delta) {
  calMonth.setMonth(calMonth.getMonth() + delta);
  renderCalendar();
}

function renderCalendar() {
  const grid = document.getElementById('calendar-grid');
  const label = document.getElementById('cal-month-label');
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();

  label.textContent = calMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = formatDateKey(new Date());
  const selectedStr = formatDateKey(currentDate);

  let html = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
    .map(d => `<div class="cal-header">${d}</div>`).join('');

  for (let i = 0; i < firstDay; i++) {
    html += '<div class="cal-day empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const key = formatDateKey(date);
    const hasData = window._dateCache.has(key);
    const isToday = key === todayStr;
    const isSelected = key === selectedStr;
    let cls = 'cal-day';
    if (hasData) cls += ' has-data';
    else cls += ' no-data';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    html += `<div class="${cls}" onclick="selectCalDate('${key}')">${d}</div>`;
  }

  grid.innerHTML = html;
}

function selectCalDate(dateStr) {
  currentDate = new Date(dateStr + 'T12:00:00');
  document.getElementById('selected-date').value = dateStr;
  switchTab('editor');
  loadDate(dateStr);
}

// --- Upcoming ---
function renderUpcoming() {
  const list = document.getElementById('upcoming-list');
  const today = new Date();
  let html = '';

  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    const key = formatDateKey(d);
    const hasData = window._dateCache.has(key);
    const dayLabel = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const badge = hasData
      ? '<span class="bulk-badge status-saved">Ready</span>'
      : '<span class="bulk-badge status-empty">Empty</span>';
    const preview = hasData ? 'Questions scheduled' : 'No questions yet';
    html += `
      <div class="bulk-row" onclick="selectCalDate('${key}')">
        <span class="bulk-date">${dayLabel}</span>
        <span class="bulk-preview">${preview}</span>
        ${badge}
      </div>`;
  }

  list.innerHTML = html;
}

// --- Import ---
function showImportModal() { document.getElementById('import-modal').classList.remove('hidden'); }
function closeImportModal() { document.getElementById('import-modal').classList.add('hidden'); }

function doImport() {
  const text = document.getElementById('import-text').value;
  const parsed = parseSwiftQuestions(text);
  if (parsed.length === 0) {
    toast('Could not parse any questions.', true);
    return;
  }
  renderQuestions(parsed.slice(0, 3));
  closeImportModal();
  toast(`Imported ${Math.min(parsed.length, 3)} questions`);
}

function parseSwiftQuestions(text) {
  const results = [];
  // Find each TriviaQuestion( and then balance parens to find the end
  const marker = 'TriviaQuestion(';
  let pos = 0;
  while (true) {
    const start = text.indexOf(marker, pos);
    if (start === -1) break;
    // Find matching closing paren, respecting strings
    let depth = 0;
    let i = start + marker.length - 1; // points at '('
    let inString = false;
    let escaped = false;
    for (; i < text.length; i++) {
      const ch = text[i];
      if (escaped) { escaped = false; continue; }
      if (ch === '\\') { escaped = true; continue; }
      if (ch === '"') { inString = !inString; continue; }
      if (inString) continue;
      if (ch === '(') depth++;
      if (ch === ')') { depth--; if (depth === 0) break; }
    }
    const inner = text.substring(start + marker.length, i);
    pos = i + 1;

    // Extract string field values
    const get = (key) => {
      const idx = inner.indexOf(key + ':');
      if (idx === -1) return '';
      // Find the opening quote after the key
      let q1 = inner.indexOf('"', idx + key.length + 1);
      if (q1 === -1) return '';
      // Find the closing quote (skip escaped quotes)
      let q2 = q1 + 1;
      while (q2 < inner.length) {
        if (inner[q2] === '\\') { q2 += 2; continue; }
        if (inner[q2] === '"') break;
        q2++;
      }
      return inner.substring(q1 + 1, q2)
        .replace(/\\"/g, '"')
        .replace(/\\'/g, "'")
        .replace(/\\n/g, '\n');
    };

    const q = get('question');
    const a = get('answer');
    if (q || a) {
      results.push({
        date: get('date'),
        questionType: get('questionType') || 'General Knowledge',
        artist: get('artist') || 'N/A',
        question: q,
        answer: a,
        funFact: get('funFact'),
      });
    }
  }
  return results;
}

// Import ALL embedded app data at once
async function importAllFromApp() {
  const text = document.getElementById('import-text').value;
  if (!text.trim()) {
    toast('Paste your full DailyTrivia.swift questions array into the text box first.', true);
    return;
  }

  const allQuestions = parseSwiftQuestions(text);
  if (allQuestions.length === 0) {
    toast('Could not parse any questions. Check the console for details.', true);
    console.log('Input text length:', text.length);
    return;
  }

  // Group by date string (e.g. "Apr 26")
  const grouped = {};
  for (const q of allQuestions) {
    if (!q.date) continue;
    if (!grouped[q.date]) grouped[q.date] = [];
    grouped[q.date].push({
      questionType: q.questionType,
      artist: q.artist,
      question: q.question,
      answer: q.answer,
      funFact: q.funFact,
    });
  }

  const dateCount = Object.keys(grouped).length;
  if (!confirm(`Found ${allQuestions.length} questions across ${dateCount} dates. Upload all to Firestore?`)) return;

  closeImportModal();
  toast(`Uploading ${dateCount} days...`);

  // Convert "Apr 26" to "2026-04-26"
  const year = new Date().getFullYear();
  let saved = 0;
  let failed = 0;
  for (const [appDate, qs] of Object.entries(grouped)) {
    const parsed = new Date(`${appDate}, ${year}`);
    if (isNaN(parsed.getTime())) { failed++; continue; }
    const key = formatDateKey(parsed);
    try {
      await _setDoc(_doc(_db, 'dailyTrivia', key), {
        date: appDate,
        dateKey: key,
        questions: qs.slice(0, 3),
        updatedAt: new Date().toISOString()
      });
      window._dateCache.add(key);
      saved++;
    } catch(e) {
      console.error('Failed to save', key, e);
      failed++;
    }
  }

  toast(failed ? `Imported ${saved} days (${failed} failed)` : `Imported ${saved} days of trivia!`);
  loadDate(formatDateKey(currentDate));
}

// --- Stats ---
let statsDate = new Date();

function goStatsToday() {
  statsDate = new Date();
  document.getElementById('stats-date').value = formatDateKey(statsDate);
  loadStats(formatDateKey(statsDate));
}

function changeStatsDate(delta) {
  statsDate.setDate(statsDate.getDate() + delta);
  document.getElementById('stats-date').value = formatDateKey(statsDate);
  loadStats(formatDateKey(statsDate));
}

async function loadStats(dateStr) {
  statsDate = new Date(dateStr + 'T12:00:00');
  const container = document.getElementById('stats-content');
  container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px;">Loading...</p>';

  try {
    // Load both the questions and the stats in parallel
    const [triviaSnap, statsSnap] = await Promise.all([
      _getDoc(_doc(_db, 'dailyTrivia', dateStr)),
      _getDoc(_doc(_db, 'triviaStats', dateStr))
    ]);

    if (!statsSnap.exists()) {
      const hasQuestions = triviaSnap.exists();
      container.innerHTML = `<div class="stats-empty">${hasQuestions ? 'No answers recorded yet for this day.' : 'No trivia scheduled for this day.'}</div>`;
      return;
    }

    const stats = statsSnap.data();
    const questions = triviaSnap.exists() ? (triviaSnap.data().questions || []) : [];

    // Calculate totals
    let totalCorrect = 0, totalWrong = 0, totalSkipped = 0;
    for (let i = 0; i < 3; i++) {
      totalCorrect += stats[`q${i}_correct`] || 0;
      totalWrong += stats[`q${i}_wrong`] || 0;
      totalSkipped += stats[`q${i}_skipped`] || 0;
    }
    const totalAnswers = totalCorrect + totalWrong + totalSkipped;
    const uniquePlayers = Math.round((stats.total_attempts || 0) / 3) || Math.ceil(totalAnswers / 3);
    const overallPct = totalAnswers > 0 ? Math.round((totalCorrect / totalAnswers) * 100) : 0;

    let html = `
      <div class="stats-summary">
        <div class="stats-summary-item">
          <div class="num">${uniquePlayers}</div>
          <div class="label">Players (est.)</div>
        </div>
        <div class="stats-summary-item">
          <div class="num">${totalAnswers}</div>
          <div class="label">Total Answers</div>
        </div>
        <div class="stats-summary-item">
          <div class="num" style="color:var(--accent)">${overallPct}%</div>
          <div class="label">Correct Rate</div>
        </div>
      </div>
    `;

    for (let i = 0; i < 3; i++) {
      const correct = stats[`q${i}_correct`] || 0;
      const wrong = stats[`q${i}_wrong`] || 0;
      const skipped = stats[`q${i}_skipped`] || 0;
      const total = correct + wrong + skipped;
      const pctCorrect = total > 0 ? Math.round((correct / total) * 100) : 0;
      const pctWrong = total > 0 ? Math.round((wrong / total) * 100) : 0;
      const pctSkipped = total > 0 ? Math.round((skipped / total) * 100) : 0;

      const questionText = questions[i] ? questions[i].question : '';
      const answerText = questions[i] ? questions[i].answer : '';

      html += `
        <div class="stats-card">
          <h3>Question ${i + 1}${answerText ? ` — Answer: ${escHTML(answerText)}` : ''}</h3>
          ${questionText ? `<div class="stats-question-text">${escHTML(questionText)}</div>` : ''}
          <div class="stats-bars">
            <div class="stats-row">
              <span class="stats-label" style="color:var(--accent)">Correct</span>
              <div class="stats-bar-bg">
                <div class="stats-bar-fill correct" style="width:${Math.max(pctCorrect, 0)}%">${pctCorrect > 8 ? pctCorrect + '%' : ''}</div>
              </div>
              <span class="stats-count">${correct}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label" style="color:var(--danger)">Wrong</span>
              <div class="stats-bar-bg">
                <div class="stats-bar-fill wrong" style="width:${Math.max(pctWrong, 0)}%">${pctWrong > 8 ? pctWrong + '%' : ''}</div>
              </div>
              <span class="stats-count">${wrong}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label" style="color:#888">Skipped</span>
              <div class="stats-bar-bg">
                <div class="stats-bar-fill skipped" style="width:${Math.max(pctSkipped, 0)}%">${pctSkipped > 8 ? pctSkipped + '%' : ''}</div>
              </div>
              <span class="stats-count">${skipped}</span>
            </div>
          </div>
        </div>
      `;
    }

    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = `<div class="stats-empty">Failed to load stats: ${escHTML(e.message)}</div>`;
  }
}

window.signIn = signIn;
window.signOut = signOut;

window.goToday = goToday;
window.loadDate = loadDate;

window.deleteDay = deleteDay;
window.switchTab = switchTab;
window.changeMonth = changeMonth;
window.selectCalDate = selectCalDate;
window.showImportModal = showImportModal;
window.closeImportModal = closeImportModal;
window.doImport = doImport;
window.importAllFromApp = importAllFromApp;
window.goStatsToday = goStatsToday;
window.changeStatsDate = changeStatsDate;
window.loadStats = loadStats;
</script>
